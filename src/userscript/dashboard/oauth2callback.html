<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Read Frog — authorizing…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color-scheme: light dark;
        background: Canvas;
        color: CanvasText;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <!--
      OAuth landing page for the Google Drive sync flow.

      Intentionally scriptless. The provider redirects here with the token in the
      URL fragment; the Read Frog userscript matches this page, copies the
      fragment into GM storage for the tab that started the flow, and closes the
      window. Putting the logic in the script rather than here keeps the token
      out of any JavaScript this page could have served.
    -->
    <p>Finishing sign-in…</p>
  </body>
</html>
