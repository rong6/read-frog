# NOTE (userscript fork): this workflow is inherited from upstream and its
# automatic triggers have been removed. This fork exists only to build the
# userscript; PR gates, scheduled chores and the extension release/publish
# pipeline are upstream's business, and left firing they would either fail for
# want of secrets or do something genuinely unwanted (publish a release, close
# this fork's issues). Kept runnable by hand rather than deleted, so the
# upstream logic is still here if it is ever needed.
name: Maintenance - Stale Issues & PRs

on:
  workflow_dispatch:

jobs:
  stale:
    name: Mark Stale Items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- Issue settings ----
          days-before-issue-stale: 30
          days-before-issue-close: 60
          exempt-issue-labels: pinned,on-hold
          stale-issue-message: |
            This issue has been inactive for 30 days and is now marked as stale.
            It will be automatically closed in 60 days if no further activity occurs.
          close-issue-message: |
            Since it has been a long time without updates, the issue has been automatically closed.
            If you need to continue, please reopen or create a new issue.

          # ---- PR settings ----
          days-before-pr-stale: 14
          days-before-pr-close: 30
          stale-pr-message: |
            This PR has been inactive for 14 days and is now marked as stale.
            It will be automatically closed in 30 days if no further activity occurs.
          close-pr-message: |
            Since it has been a long time without updates, the PR has been automatically closed.
            If you need to continue, please reopen or create a new PR.
          exempt-pr-labels: pinned,WIP,on-hold
