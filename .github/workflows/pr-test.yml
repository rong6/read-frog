# NOTE (userscript fork): this workflow is inherited from upstream and its
# automatic triggers have been removed. This fork exists only to build the
# userscript; PR gates, scheduled chores and the extension release/publish
# pipeline are upstream's business, and left firing they would either fail for
# want of secrets or do something genuinely unwanted (publish a release, close
# this fork's issues). Kept runnable by hand rather than deleted, so the
# upstream logic is still here if it is ever needed.
name: PR - Test & Build

on:
  workflow_dispatch:

env:
  WXT_SKIP_ENV_VALIDATION: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Check for eruda imports
        run: |
          if grep -r "import.*eruda" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v ":.*[[:space:]]*//.*import.*eruda"; then
            echo "❌ Found uncommented eruda imports in the codebase!"
            echo "Please comment out or remove eruda imports before merging."
            exit 1
          else
            echo "✅ No uncommented eruda imports found."
          fi
        shell: bash

      - name: Format check
        run: pnpm exec nx fmt:check

      - name: Lint and type check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test --exclude="**/free-api.test.ts"
